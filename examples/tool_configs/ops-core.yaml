# Example tools_config.yaml profile: ops-core
#
# Activation: point the server at this file via the
# GOOGLE_ADS_MCP_TOOLS_CONFIG environment variable, e.g.:
#
#   GOOGLE_ADS_MCP_TOOLS_CONFIG=/path/to/ops-core.yaml
#
# This is read at server startup, so switching profiles or editing this
# file only needs a restart of the MCP client — no reinstall of the
# package, unlike changes to the bundled ads_mcp/tools_config.yaml.
#
# Profile: day-to-day campaign operations without the channel-specific
# namespaces (no demandgen, pmax, shopping, video, display, audiences,
# tracking or experiments) — customers, search and metadata for reporting;
# mutate for Search campaign/ad group/ad/keyword management; negatives and
# targeting; extensions (assets); optimize for recommendations and
# change-history. All write tools here still default to a dry-run preview
# behind the `confirm` parameter (see README-EXTENDED.md, "Safety model").
#
# Approximate tools/list weight: ≈81.9 KB, about 44% smaller than the full
# 16-namespace default. See README-EXTENDED.md for the per-namespace
# token-cost table these numbers come from.
#
# Reminder on semantics (ads_mcp/config.py): once a `namespaces` key is
# present, any namespace NOT listed under it is disabled. There is no
# need to list disabled namespaces explicitly, but every other namespace
# is listed below, commented out, so enabling one is a quick edit:
# uncomment the line and flip `false` to `true`.

namespaces:
  customers: true
  search: true
  metadata: true
  mutate: true
  negatives: true
  targeting: true
  extensions: true
  optimize: true

  # demandgen: false
  # pmax: false
  # shopping: false
  # video: false
  # display: false
  # tracking: false
  # audiences: false
  # experiments: false
